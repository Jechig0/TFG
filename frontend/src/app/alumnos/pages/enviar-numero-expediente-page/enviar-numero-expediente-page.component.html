<div class="flex min-h-screen items-center justify-center bg-base-300">
  <div class="card w-full max-w-md shadow-2xl bg-base-100">
    <div class="card-body">
      <h2 class="card-title justify-center">Login</h2>

      <form
      class="form-control w-full max-w-xs space-y-3 text-center items-center"
      (ngSubmit)="validarYRedirigir(codigoAlumno.value, dni.value)"
  >

  <!-- Código alumno -->
  <input
    type="text"
    placeholder="Código del alumno"
    #codigoAlumno
    class="input input-bordered input-primary w-full"
  />

  <!-- DNI -->
  <input
    type="text"
    placeholder="4 últimos dígitos del DNI + letra"
    #dni
    class="input input-bordered input-secondary w-full"
  />

  <!-- Botón -->
  <button type="submit" class="btn btn-primary w-full">
    Acceder
  </button>

      </form>
    </div>
  </div>
</div>
