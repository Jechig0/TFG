<!-- Input de fichero para subir el expediente académico -->
<label class="form-control w-full max-w-sm">
  <div class="label">
    <span class="label-text font-semibold text-base">Sube tu expediente académico (PDF)</span>
  </div>
  <input
    type="file"
    accept="application/pdf"
    class="file-input file-input-bordered file-input-primary w-full"
    (change)="onFileSelected($event)"
  />
</label>
