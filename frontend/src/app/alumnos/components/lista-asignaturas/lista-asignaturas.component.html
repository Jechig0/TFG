<div class="relative max-w-sm">
  <label class="input input-bordered flex items-center gap-2 bg-neutral text-neutral-content">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input
      type="text"
      class="grow bg-neutral text-neutral-content placeholder-neutral-content"
      placeholder="Buscar asignatura"
      [(ngModel)]="searchText"
    />
</label>


@if(asignaturaResource.hasValue() && this.searchText() != this.selectedAsignatura()){
  <ul
    class="absolute z-50 mt-1 w-full bg-base-200 text-base-content rounded-box shadow-lg max-h-60 overflow-auto">
  @for (asignaturas of asignaturaResource.value(); track $index) { 
    
    @for (asignatura of asignaturas | filterByText:searchText(); track $index) {
        <li>
          <button
            type="button"
            class="w-full text-left px-4 py-2 hover:bg-primary hover:text-primary-content"
            (mousedown)="onAsignaturaClick(asignatura)"
          >
            {{ asignatura }}
          </button>
        </li>
    }
    
    
  }
  </ul>
      
}
</div>
